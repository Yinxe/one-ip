name = "one-ip"
main = "public/worker/index.js"
# Pages reads this key, Workers ignores it. Keeping both in one file lets the
# same commit deploy as a Worker (`wrangler deploy`) and as a Pages project
# (`wrangler pages deploy` or Pages Git integration).
pages_build_output_dir = "./dist"
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
# Pages reserves the binding name "ASSETS" for the project's own asset serving,
# and rejects the configuration when a Pages project declares it. The Workers
# Static Assets binding therefore uses a different name.
binding = "STATIC_ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/worker", "/worker/*"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.1
invocation_logs = false

[observability.traces]
enabled = false

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 180, period = 60 }

[[ratelimits]]
name = "ACTION_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Local development forwards all page and asset requests to Vite.
[env.local.assets]
directory = "./public"
binding = "STATIC_ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[env.local.ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 180, period = 60 }

[[env.local.ratelimits]]
name = "ACTION_LIMITER"
namespace_id = "1002"
simple = { limit = 5, period = 60 }
